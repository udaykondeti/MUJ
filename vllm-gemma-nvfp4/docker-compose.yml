# vLLM serving Gemma 4 12B (NVFP4) on kirakon (RTX 5060 Ti, Blackwell SM120).
# Usage:
#   cp .env.example .env      # then edit HF_TOKEN etc.
#   docker compose up -d
#   docker compose logs -f
services:
  vllm-gemma:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:nightly}
    container_name: vllm-gemma-nvfp4
    restart: unless-stopped
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-8000}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      # FlashInfer attention backend — fastest path on Blackwell.
      VLLM_ATTENTION_BACKEND: FLASHINFER
    volumes:
      # Persist the HF cache on the host so weights download only once.
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    ipc: host            # vLLM needs a large /dev/shm for tensor sharing
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model ${MODEL:-AxionML/Gemma-4-12B-NVFP4}
      --served-model-name ${SERVED_MODEL_NAME:-gemma-4-12b}
      --host 0.0.0.0
      --port 8000
      --max-model-len ${MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.90}
      --max-num-seqs ${MAX_NUM_SEQS:-4}
      --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-4096}
      --kv-cache-dtype ${KV_CACHE_DTYPE:-fp8}
      --dtype ${DTYPE:-bfloat16}
      ${API_KEY:+--api-key ${API_KEY}}
      ${QUANTIZATION:+--quantization ${QUANTIZATION}}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:8000/health\"); sys.exit(0)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 600s   # first run downloads ~7 GB of weights
